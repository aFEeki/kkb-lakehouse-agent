name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend and dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Verify package import
        run: python -c "import kkb_agent"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Unit tests (no external credentials)
        run: python -m pytest -q
      - name: Published three-turn regression
        run: python scripts/run_regression.py

      # SCRUM-32. Separate from the unit tests so a red invariant is legible on the status
      # page as a data-correctness failure rather than one more failing test: these check
      # that published figures still add up, which is the claim the whole project rests on.
      # They run against the committed fixture under tests/fixtures/invariants, so they
      # need no lake and no credentials.
      - name: Data invariants
        run: python -m pytest -m invariant -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix web ci
      - run: npm --prefix web run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8101
      - run: python scripts/browser_smoke.py
