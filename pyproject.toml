[project]
name = "kkb-lakehouse-agent"
version = "0.1.0"
description = "Agentic lakehouse analytics over BDDK and EVDS data — KKB Hackathon 2026"
requires-python = ">=3.11"

dependencies = [
    # LLM — MIA / Kloudeks only. No other provider may be added.
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",

    # Data
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "openpyxl>=3.1",      # .xlsx
    "xlrd>=2.0",          # .xls — BDDK still serves some legacy files

    # Documents
    "pypdf>=4.2",
    "pypdfium2>=4.30",    # PDF -> PNG without a poppler system dep
    "httpx>=0.27",
    "truststore>=0.9",   # bddk.org.tr chain fails certifi; use the OS trust store
    "beautifulsoup4>=4.12",
    "lxml>=5.2",

    # Retrieval
    "lancedb>=0.13",

    # Analysis
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",  # ADF/KPSS, cointegration, Granger/Toda-Yamamoto
    "ruptures>=1.1",      # change-point detection

    # Output
    "plotly>=5.22",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
browser = [
    "playwright>=1.44",   # JS-rendered pages; run `playwright install chromium`
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "invariant: data-correctness checks that gate the gold build",
    "network: hits a live external source",
]
