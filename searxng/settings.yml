# Local SearxNG for the web search tool. Everything not set here keeps the upstream
# default.
use_default_settings: true

server:
  # Local-only instance, so a fixed key is fine and keeps the container reproducible.
  secret_key: "kkb-lakehouse-agent-local"
  # The tool issues one request per search from the backend, not from a browser.
  limiter: false

search:
  formats:
    - html
    # The reason this file exists: SearxNG serves HTML only unless json is listed, and
    # the provider calls /search?format=json.
    - json

outgoing:
  # A search that hangs is worse than one that returns fewer results. With the defaults,
  # wikidata timed out at 60s and the worker was killed mid-request, which the client saw
  # as a disconnect rather than a timeout.
  request_timeout: 4.0
  max_request_timeout: 6.0

engines:
  # Observed failing from this network: wikidata times out, duckduckgo answers with a
  # CAPTCHA. Both stall the whole search because results are gathered before responding.
  - name: wikidata
    disabled: true
  - name: duckduckgo
    disabled: true
